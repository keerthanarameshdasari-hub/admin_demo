name: CI

# Build and test checks for every pull request into the promotion branches.
# Security scanning lives in security.yml. docs/ci.md explains each job, why it
# exists and what to do when it fails.

on:
  pull_request:
    branches: [dev, test, main]

# Deny everything by default; each job asks only for what it needs.
permissions: {}

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  types:
    name: Types and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pinned spec matches its lock, and the client is regenerated from it
        # No network: checks api/openapi.json against api/openapi.lock.json, regenerates
        # src/api/schema.d.ts and fails if the committed copy differs.
        run: npm run api:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Contract canary (a renamed API field must break tsc)
        run: npm run api:canary

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vitest (API mocked with MSW)
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (environment-neutral; config.json is written at deploy time)
        run: npm run build

      # The E2E and bundle-size jobs test this exact output rather than rebuilding.
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-dist
          path: dist/

      - name: Install Chromium for Playwright
        # Same Playwright version as package-lock.json, so the browser matches.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright headless against the build and the MSW mock API
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  bundle-size:
    name: Bundle size budget
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the repository code
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-dist
          path: dist/

      # Plain Node built-ins only, so no npm install is needed.
      - name: Check gzipped JS/CSS against bundle-budget.json
        run: node scripts/check-bundle-size.mjs

  # The one check to require in the branch rulesets. GitHub treats a skipped
  # required check as passing, so this job always runs and fails unless every
  # job above actually succeeded (not skipped, cancelled or failed).
  admin-ci-passed:
    name: admin-ci-passed
    if: always()
    needs: [lint, types, unit, build, e2e, bundle-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not succeed: $(echo "$failed" | paste -sd, -)"
            exit 1
          fi
